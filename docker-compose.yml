# docker-compose.yml
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: billflow_db
    environment:
      POSTGRES_USER: billflow_user
      POSTGRES_PASSWORD: billflow_pass
      POSTGRES_DB: billflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billflow_user -d billflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: